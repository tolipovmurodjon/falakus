<title>NISAR Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap">
<style>
/* Layout: 1200x675 slide stage, Eye Run look: pale page, soft mint + blue light, white glass, mint mono numbers */
@font-face{font-family:"Departure Mono";src:url("{{FONT}}") format("woff2");font-display:swap}
:root{
  --page:#F2F4F8; --ink:#0F1630; --ink-2:#4B5470; --ink-3:#8A92AA; --line:#E6E9F1;
  --mint:#1C7E69; --mint-s:rgba(28,126,105,.10);
  --amber:#B45309; --amber-s:rgba(180,83,9,.10);
  --blue:#2563EB; --blue-s:rgba(37,99,235,.09);
  --violet:#7C3AED; --violet-s:rgba(124,58,237,.09);
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Departure Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:28px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 12% -8%,#D9F0E6 0%,transparent 62%),radial-gradient(900px 560px at 92% 2%,#DDE6FB 0%,transparent 58%),radial-gradient(800px 500px at 60% 115%,#E1F2EC 0%,transparent 60%),var(--page)}
.stage{position:fixed;left:50%;top:50%;width:1200px;height:675px;transform-origin:center}
.glass{position:relative;border-radius:var(--r);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 1px 1px rgba(15,22,48,.04),0 10px 28px -14px rgba(15,22,48,.22),inset 0 1px 0 rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 42%)}
.glass>*{position:relative}
.mint-card{background:linear-gradient(150deg,#1C7E69 0%,#23A06C 100%);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:0 18px 36px -16px rgba(28,126,105,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.mint-card::before{background:linear-gradient(145deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%)}
.slide{position:absolute;inset:0;padding:40px 52px 96px;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .4s ease,transform .45s cubic-bezier(.23,1,.32,1),visibility 0s .4s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s ease,transform .45s cubic-bezier(.23,1,.32,1)}
.slide.back{transform:translateX(-18px)}
@media (prefers-reduced-motion:reduce){.slide,.slide.on{transition:opacity .15s;transform:none}}
.eyebrow{font:400 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
h1,h2,h3{font-family:var(--sans);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.03em}
h2{font-weight:800;font-size:36px;line-height:1.08;letter-spacing:-.025em}
h3{font-weight:800;font-size:19px;line-height:1.25;letter-spacing:-.012em}
p{margin:0}
.muted{color:var(--ink-2)}
.kpi{border-radius:18px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 22px -16px rgba(15,22,48,.3),inset 0 1px 0 rgba(255,255,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:12px 14px;min-height:94px}
.kpi b{display:block;font:400 22px/1 var(--mono);letter-spacing:-.03em;color:var(--mint)}
.kpi span{display:block;font:400 11px/1.4 var(--mono);color:var(--ink-2);margin-top:8px}
.kpi.warn b{color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:7px;font:400 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--s-soft,var(--mint-s));color:var(--s,var(--mint));white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--s,var(--mint))}
.c-amber{--s:var(--amber);--s-soft:var(--amber-s)}.c-blue{--s:var(--blue);--s-soft:var(--blue-s)}.c-violet{--s:var(--violet);--s-soft:var(--violet-s)}
.lab{font:400 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ul li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.45}
.ul li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.ul.amber li::before{background:var(--amber)}
.raw{font:400 12.5px/1.55 var(--mono);background:rgba(15,22,48,.045);border-radius:14px;padding:14px 16px;color:var(--ink);white-space:pre;overflow:hidden}
.raw .hl{color:var(--amber)}.raw .mi{color:var(--mint)}.raw .bl{color:var(--blue)}.raw .vi{color:var(--violet)}
.find{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:absolute;left:52px;right:52px;top:150px;height:440px}
.find>.glass{padding:22px 24px;display:grid;align-content:start;gap:10px}
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px 9px;border-radius:999px;z-index:5}
.dock button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .2s}
.dock button:hover{background:rgba(15,22,48,.05)}
.dots{display:flex;gap:6px;align-items:center}
.dots button{all:unset;cursor:pointer;width:7px;height:7px;border-radius:99px;background:rgba(15,22,48,.16);transition:width .3s cubic-bezier(.23,1,.32,1),background .3s}
.dots button.on{width:22px;background:var(--mint)}
.count{font:400 12px/1 var(--mono);color:var(--ink-2);min-width:50px;text-align:center}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.idea{padding:11px 14px;border-radius:18px;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.idea b{font:400 13px/1.3 var(--mono);color:var(--mint)}
.idea h4{margin:0;font-weight:600;font-size:14.5px;line-height:1.3}
.idea p{font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:3px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35;vertical-align:top}
th{font:400 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
td b{font-weight:600}
.tight th,.tight td{padding:4px 8px;font-size:12px}.tight .chip{padding:4px 8px}
.pic{border-radius:16px;background:#0b0f1c;display:block;width:100%;height:100%;object-fit:contain}
.cap{font:400 10.5px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.04em}
.tbtn{all:unset;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.06em;padding:8px 12px;border-radius:999px;background:rgba(15,22,48,.05);color:var(--ink-2)}
.tbtn.on{background:var(--mint);color:#fff}
input[type=range]{width:100%;accent-color:#1C7E69}
.qa{padding:14px 16px;border-radius:18px;display:grid;gap:6px}
.qa .ans{font-size:13px;color:var(--mint);line-height:1.45}
</style>

<main class="stage" id="stage" aria-roledescription="slide deck"></main>

<script>
const IMG={hero:"{{HERO}}",hh:"{{HH}}",hv:"{{HV}}",gunw:"{{GUNW}}",goff:"{{GOFF}}"};
const SERIES={
 aral_east:{name:"Aral · north frame",data:{{S_ARAL_EAST}},note:"Frame 45-48°N, 58-62°E. Watch the dark water in the middle change shape from June to October. Dark = smooth water, the flash bounces away like a mirror. Same track, same look angle, so the change is real."},
 aral_west:{name:"Aral · west + Ustyurt",data:{{S_ARAL_WEST}},note:"The first date (19 Jun) is a broken frame with stripes: a bad acquisition. The green wash is HV at its noise floor over the dry seabed, not plants. A pro throws both out before measuring."},

 qosh:{name:"Qosh Tepa canal · Afghanistan",data:{{S_QOSH}},note:"Desert north, river valley and farms south. The canal is a thin line, too small for this preview. The full file has 10-20 m pixels, enough to see it."},
 fergana:{name:"Fergana valley · Uzbekistan",data:{{S_FERGANA}},note:"Farmland and mountains. At preview size the fields look stable; the cotton season shows up as HV rising then falling in the full-resolution pixels."}

/* 1 cover */
S.push(`
 <div style="position:absolute;left:56px;top:54px;width:560px;display:grid;gap:18px">

  <h1>NISAR sees through clouds, dust and night. Here is what that really looks like.</h1>

  <div class="kpi"><b>163,672</b><span>radar brightness files (GCOV)</span></div>
  <div class="kpi"><b>36</b><span>NISAR product types in the archive</span></div>
  <div class="kpi"><b>28</b><span>dates over Tashkent, 20 Jun → 20 Oct</span></div>
  <div class="kpi"><b>0.5-5.7 GB</b><span>per file · we cut a box</span></div>
  <div class="kpi"><b>6,789</b><span>urgent disaster files, to 13 Nov</span></div>
  <div class="kpi warn"><b>Sun 23:59</b><span>submission closes</span></div>
 </div>
 <figure class="glass" style="position:absolute;left:650px;top:54px;width:500px;height:526px;margin:0;padding:12px;display:grid;grid-template-rows:1fr auto;gap:8px">
  <img class="pic" src="${IMG.hero}" alt="NISAR radar picture of the desert east of the Aral Sea">

`);

S.push(`${F("01 · first, the good news","Everything we need is real, free and already over Uzbekistan")}

 </div>
`);

/* 3 how radar sees */
S.push(`${F("02 · how radar sees","A camera that brings its own flash, and looks sideways")}
 <div class="glass" style="position:absolute;left:52px;top:150px;width:690px;height:440px;padding:0">
  <svg viewBox="0 0 690 440" width="690" height="440" aria-label="Radar beam hitting water, field, forest and town">
   <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1C7E69"/></marker>

   <g transform="translate(96,40)"><rect x="-22" y="-10" width="44" height="20" rx="4" fill="#0F1630"/><rect x="-60" y="-4" width="34" height="8" fill="#2563EB"/><rect x="26" y="-4" width="34" height="8" fill="#2563EB"/></g>

   ${[0,1,2].map(i=>`<g transform="translate(${430+i*34},300)"><rect x="-2" y="10" width="4" height="30" fill="#6B4F2A"/><circle cx="0" cy="0" r="16" fill="#2E8B57"/></g>`).join("")}
   <path d="M470 300 L95 105" stroke="#7C3AED" stroke-width="2" marker-end="url(#a1)"/>
   <rect x="580" y="282" width="34" height="58" fill="#4B5470"/><rect x="616" y="300" width="28" height="40" fill="#8A92AA"/>
   <path d="M600 338 L110 92" stroke="#0F1630" stroke-width="3" marker-end="url(#a1)"/>
   ${[["WATER",175,"mirror, bounces away","dark"],["FIELD",330,"rough, some comes back","medium"],["FOREST / CROPS",480,"tumbles in leaves","HV high"],["TOWN",612,"wall + ground corner","very bright"]].map(([t,x,d,v])=>`<text x="${x}" y="372" text-anchor="middle" font-family="Departure Mono,monospace" font-size="11" fill="#0F1630">${t}</text><text x="${x}" y="390" text-anchor="middle" font-family="Inter Tight,sans-serif" font-size="12" fill="#4B5470">${d}</text><text x="${x}" y="410" text-anchor="middle" font-family="Departure Mono,monospace" font-size="12" fill="#1C7E69">${v}</text>`).join("")}
  </svg>
 </div>
 <div class="glass" style="position:absolute;left:760px;right:52px;top:150px;height:440px;padding:20px 22px;display:grid;align-content:start;gap:10px">
  <p class="lab">the 5 facts</p>
  <ul class="ul">
   <li><b>Active:</b> it sends its own radio pulse, so night, cloud and dust do not matter.</li>
   <li><b>L-band, about 24 cm waves:</b> they pass leaves and hit branches and soil.</li>
   <li><b>Sideways look:</b> slopes facing it look fake bright, slopes facing away fake dark. RTC removes that.</li>
   <li><b>HH:</b> sent flat, back flat. <b>HV:</b> sent flat, back on its edge, only after bouncing inside plants.</li>
   <li><b>Every 12 days</b> the same orbit repeats; a 240 km wide strip each pass.</li>
  </ul>
 </div>
`);

/* 4 HH vs HV */
S.push(`${F("03 · HH vs HV, real pixels","Same place, same second, two different stories")}
 <div style="position:absolute;left:52px;top:150px;width:660px;height:440px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <figure class="glass" style="margin:0;padding:10px;display:grid;grid-template-rows:1fr auto;gap:6px"><img class="pic" src="${IMG.hh}" alt="HH channel, Aral west coast"><figcaption class="cap"><b style="color:var(--mint)">HH</b> · 17 Oct 2026 · Aral west basin + Ustyurt edge</figcaption></figure>
  <figure class="glass" style="margin:0;padding:10px;display:grid;grid-template-rows:1fr auto;gap:6px"><img class="pic" src="${IMG.hv}" alt="HV channel, same frame"><figcaption class="cap"><b style="color:var(--violet)">HV</b> · same frame, same second</figcaption></figure>
 </div>
 <div class="glass" style="position:absolute;left:730px;right:52px;top:150px;height:440px;padding:20px 22px;display:grid;align-content:start;gap:10px">
  <p class="lab">what you see</p>
  <ul class="ul"><li><b>HH</b> draws the coastline, cliffs and the old seabed patterns. Smooth wet ground and water are dark.</li><li><b>HV</b> is almost empty. The dry seabed has no plants, so almost nothing comes back tilted.</li></ul>
  <p class="lab" style="margin-top:6px">the expert trap</p>
  <ul class="ul amber"><li>The bright vertical stripes in HV are the instrument's own <b>noise floor</b>, not vegetation. When the real signal is tiny, you see the radar's hiss.</li><li>Rule: before calling HV "plants", check it is well above the noise level the file reports.</li></ul>
  <p class="lab" style="margin-top:6px">frisbee picture</p>
  <p style="font-size:14px">Throw a frisbee flat at a wall: it comes back flat (HH). Throw it into a bush: it comes out tumbling on its edge (HV).</p>
 </div>
`);

 <p style="position:absolute;left:56px;right:56px;top:564px;font-size:13.5px" class="muted">Helpers in the same archive: <b>NISAR_WATERMASK</b> (known water), <b>NISAR_DEM</b> (heights for slope correction), <b>NISAR_VWC</b> (vegetation water). Most files are <b>provisional</b> = a public beta, partly checked. <b>14,768</b> GCOV files are already <b>validated</b> (21 Oct → 11 Nov).</p>
`);

/* 6 filename */
S.push(`${F("05 · read a filename","The name tells you where, when and how, before you download")}
 <div class="glass" style="position:absolute;left:52px;right:52px;top:150px;height:440px;padding:24px 28px;display:grid;align-content:start;gap:16px">

document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const a=document.getElementById("ans"+b.dataset.q);a.hidden=!a.hidden;b.textContent=a.hidden?"Show":"Hide"});
document.getElementById("copy").onclick=async()=>{const m=document.getElementById("copied"),t=document.getElementById("pr").textContent;
 try{await navigator.clipboard.writeText(t);m.textContent="Copied"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("pr"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Selected, press Ctrl+C"}};

let cur=-1;const SL=[...document.querySelectorAll(".slide")],DT=[...document.querySelectorAll(".dots button")];
function go(i,quiet){i=Math.max(0,Math.min(SL.length-1,i));if(i===cur)return;
 SL.forEach((s,k)=>{s.classList.toggle("on",k===i);s.classList.toggle("back",k<i)});DT.forEach((d,k)=>d.classList.toggle("on",k===i));
 document.getElementById("count").textContent=`${i+1} / ${SL.length}`;cur=i;if(!quiet)try{history.replaceState(null,"","#s"+(i+1))}catch(e){}}
document.getElementById("prev").onclick=()=>go(cur-1);document.getElementById("next").onclick=()=>go(cur+1);
DT.forEach((d,k)=>d.onclick=()=>go(k));
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const k=e.key;if(k==="ArrowRight"||k==="PageDown"||k===" "){e.preventDefault();go(cur+1)}else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1)}else if(k==="Home")go(0);else if(k==="End")go(SL.length-1)});
let wl=0;addEventListener("wheel",e=>{const t=Date.now(),d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;if(t-wl<750||Math.abs(d)<24)return;wl=t;go(cur+(d>0?1:-1))},{passive:true});
let px0=null,py0=null;addEventListener("pointerdown",e=>{if(e.target.closest("input,button"))return;px0=e.clientX;py0=e.clientY});
addEventListener("pointerup",e=>{if(px0===null)return;const dx=e.clientX-px0,dy=e.clientY-py0;px0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1))});
function fromHash(){const m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0,true)}
addEventListener("hashchange",fromHash);
function fit(){const s=Math.min(innerWidth/1200,innerHeight/675);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();fromHash();
</script>
