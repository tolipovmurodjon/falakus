<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falakus Time-lapse</title>
<link rel="stylesheet" href="site.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans)}
button:focus-visible,#chart:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* layout: picture left, readout right. Standalone the shared 56 px header sits above; embedded we fill the frame. */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);
 grid-template-areas:"stage top" "stage side";gap:14px;padding:14px;
 height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}
html.embed .tl{height:100vh;height:100dvh}

.stage{grid-area:stage;position:relative;min-height:0;background:var(--paper2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#cv{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;display:block}
.chip{position:absolute;top:12px;left:12px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font:600 11.5px/1.2 var(--sans);color:var(--ink2)}
#wait{position:absolute;inset:0;display:grid;place-items:center;font:600 13px var(--sans);color:var(--ink2)}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--teal);transition:width .2s,opacity .4s}

.top{grid-area:top}
.seg{display:flex;gap:2px;background:var(--paper2);border-radius:12px;padding:3px}
.seg button{flex:1;min-width:0;min-height:44px;border:0;background:transparent;border-radius:9px;padding:7px 10px;text-align:left;cursor:pointer;font:650 13px/1.2 var(--sans);color:var(--ink2)}
.seg button small{display:block;margin-top:2px;font:500 11.5px/1.2 var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--teal2);box-shadow:0 1px 2px rgba(20,18,13,.10)}

.side{grid-area:side;min-height:0;overflow:auto;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 12px}
.read{display:flex;flex-direction:column}
.kick{font:650 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
#big{font:800 88px/.95 var(--mono);letter-spacing:-.05em;margin:8px 0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
#wv{font:750 32px/1.05 var(--mono);color:var(--water);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
#wu{font:600 13px/1.3 var(--sans);color:var(--ink2);margin-top:3px}

#chart{display:block;width:100%;flex:1 1 150px;min-height:120px;max-height:440px;margin-top:16px;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
#chart text{font:10.5px var(--mono);fill:var(--ink2)}

.ctl{display:flex;align-items:center;gap:10px;margin-top:8px}
#play{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--teal);color:var(--card);cursor:pointer;display:grid;place-items:center}
#play:hover{background:var(--teal2)}
#play svg{width:16px;height:16px;fill:currentColor}
#range{flex:1;min-width:0;font:600 12px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#speed{flex:none;min-width:48px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:9px;font:650 12.5px var(--mono);cursor:pointer}

.foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font:500 11.5px/1.35 var(--sans);color:var(--ink2)}
#fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ib{flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink2);font:700 13px/1 var(--sans);cursor:pointer}
#ib[aria-expanded="true"]{background:var(--teal-s);color:var(--teal2);border-color:transparent}
#info{margin-top:8px;padding:10px 12px;background:var(--paper);border-radius:10px;font:500 11.5px/1.45 var(--sans);color:var(--ink2);max-height:220px;overflow:auto}
#info b{color:var(--ink);font-weight:650}
#info p{margin:0 0 6px}
#info pre{margin:0;white-space:pre-wrap;font:11px/1.45 var(--mono);color:var(--ink2)}

/* phones and narrow frames: picker, picture, then readout + chart */
@media (max-width:899px){
 .tl{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"top" "stage" "side";height:auto!important;padding:10px;gap:10px}
 .stage{height:min(44vh,520px);height:min(44dvh,520px);min-height:250px}
 #cv{inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
 .side{overflow:visible;padding:14px 14px 10px}
 .read{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
 .read .kick{flex-basis:100%}
 #big{font-size:60px;margin:4px 0 0}
 .wat{text-align:right}
 #wv{font-size:26px}
 #chart{flex:none;height:112px;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
</head>
<body>
<script src="site.js"></script>
<main class="tl">
 <div class="top"><div class="seg" id="places" role="tablist" aria-label="Place" hidden></div></div>
 <div class="stage">
  <canvas id="cv" role="img" aria-label="Time-lapse frame"></canvas>
  <div class="chip" id="chip" hidden></div>
  <div id="wait">Loading frames</div>
  <div id="bar"></div>
 </div>
 <section class="side" aria-live="polite">
  <div class="read">
   <div class="kick" id="kick">&nbsp;</div>
   <div id="big">&nbsp;</div>
   <div class="wat"><div id="wv">&nbsp;</div><div id="wu">km² open water</div></div>
  </div>
  <svg id="chart" tabindex="0" role="slider" aria-label="Open water over time. Drag to scrub." aria-valuemin="0"></svg>
  <div class="ctl">
   <button id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="pi"></svg></button>
   <span id="range"></span>
   <button id="speed" aria-label="Playback speed">1×</button>
  </div>
  <div class="foot"><span id="fl"></span><button id="ib" aria-expanded="false" aria-controls="info" aria-label="Sources and method">i</button></div>
  <div id="info" hidden></div>
 </section>
</main>
<script>
// Places that have baked frames. A place whose data fails to load is hidden, never shown broken.
// (Tashkent and Andijan optical frames are not baked yet; add entries here once data/timelapse/<id>/index.json exists.)
const PLACES=[{id:"aral",name:"Aral Sea",mode:"optical"},{id:"andijan",src:"andijan_res",name:"Andijan",mode:"optical"},{id:"andijan_res",name:"Andijan NISAR",mode:"radar"},{id:"tashkent",name:"Tashkent",mode:"optical"}];
const $=id=>document.getElementById(id);
const TOTAL=12,HOLD=.45,SPEEDS=[1,.5,2];          // one full loop = TOTAL seconds at 1×; last frame holds 2 slots
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=$("cv"),ctx=cv.getContext("2d");
const S={id:null,D:null,fr:[],bm:[],st:[],cur:0,nxt:0,t:0,a:0,playing:true,speed:1,token:0,drawn:"",lab:-1,sized:false,scrub:false};

const num=v=>v.toLocaleString("en-US",{minimumFractionDigits:v<100?1:0,maximumFractionDigits:v<100?1:0});   // whole km2 for big lakes, 1 dp for small
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dshort=d=>{const[y,m,dd]=d.split("-");return +dd+" "+MON[m-1]};
const dlong=d=>dshort(d)+" "+d.slice(0,4);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sat=s=>{if(/^Sentinel/.test(s||""))return "Sentinel-2";const m=/\(([^)]*)\)/.exec(s||"");return m?"Landsat "+m[1].replace(/L/g,"").replace(/, /g," + "):(s||"")};

// ---------- data (relative URLs, so the site works under any path) ----------
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
async function loadOptical(id){
 const ix=await getJSON(`timelapse/${id}/index.json`);const f=ix.frames||[];
 const sats=[...new Set(f.map(x=>/^Sentinel/.test(x.source||"")?"Sentinel-2":"Landsat"))].join(" + ")||"Landsat";
 return{mode:"optical",chip:`${sats} · natural colour`,
  sub:f.length?`${f[0].year}–${f[f.length-1].year}`:"",range:f.length?`${f[0].year} → ${f[f.length-1].year}`:"",
  method:ix.method||"",attrib:sats.includes("Sentinel")?"USGS Landsat Collection 2 Level-2 and ESA Copernicus Sentinel-2 L2A, via Microsoft Planetary Computer.":"USGS Landsat Collection 2 Level-2 surface reflectance, via Microsoft Planetary Computer.",
  frames:f.map(x=>({url:`timelapse/${id}/${x.file}`,big:String(x.year),tick:String(x.year),year:x.year,kick:"summer",water:x.water_km2??null,
   foot:`${sat(x.source)} · ${x.scene_count} scenes`+(x.from_other_years_pct>0?` · ${x.from_other_years_pct} % of area from ${(x.other_years||[]).join(", ")}`:""),
   detail:`<b>${x.year}</b>: ${esc(x.source)}, ${x.scene_count} scenes, ${dlong(x.dates[0])} to ${dlong(x.dates[1])}, scene cloud ${x.scene_cloud_pct} %`+(x.from_other_years_pct>0?`, ${x.from_other_years_pct} % of area from ${(x.other_years||[]).join(", ")}`:"")}))}}
async function loadRadar(id){
 const fj=await getJSON(`science/${id}/frames.json`);let wr={},wm="";
 try{const w=await getJSON("ml/water_model.json");(w.series||[]).forEach(p=>wr[p.date]=p.ml_km2);wm=(w.method||"").split("\n")[0]}catch(e){}  // learned map: the same numbers as the dashboard
 const f=(fj.frames||[]).filter(x=>x.sci!==false);
 return{mode:"radar",chip:"NISAR L-band radar · HH",
  sub:f.length?`radar · ${f[0].date.slice(0,4)}`:"",range:f.length?`${dlong(f[0].date)} → ${dlong(f[f.length-1].date)}`:"",
  method:wm,attrib:"NASA-ISRO NISAR L-band GCOV, HH polarisation.",
  frames:f.map(x=>({url:`science/${id}/img/${x.date}_hh.webp`,big:dshort(x.date),tick:dshort(x.date),year:null,kick:x.date.slice(0,4)+" · radar pass",water:wr[x.date]??null,
   foot:`NISAR L-band · HH · ${dlong(x.date)}`,detail:`<b>${dlong(x.date)}</b>: NISAR GCOV HH`+(wr[x.date]!=null?`, open water ${wr[x.date]} km²`:"")}))}}
const DATA={};
PLACES.forEach(p=>{DATA[p.id]=(p.mode==="radar"?loadRadar(p.src||p.id):loadOptical(p.src||p.id)).then(d=>{if(!d.frames.length)throw new Error("no frames");return d})});

// ---------- place picker: only places whose data loaded ----------
const ok={};
function drawPlaces(){
 const list=PLACES.filter(p=>ok[p.id]);
 $("places").hidden=list.length<2;
 $("places").innerHTML=list.map(p=>`<button role="tab" data-p="${p.id}" aria-selected="${p.id===S.id}" class="${p.id===S.id?"on":""}">${esc(p.name)}<small>${esc(ok[p.id].sub)}</small></button>`).join("")}
$("places").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.p!==S.id)choose(b.dataset.p)};

// ---------- choose a place: show frame 0's numbers at once, stream frames in, play as soon as frame 0 is decoded ----------
function choose(id){
 const D=ok[id];if(!D)return;const tok=++S.token;
 S.id=id;S.D=D;S.fr=D.frames;const n=S.fr.length;
 S.bm=new Array(n).fill(null);S.st=new Array(n).fill(0);S.cur=0;S.nxt=n>1?1:0;S.t=0;S.a=0;S.drawn="";S.lab=-1;S.sized=false;
 ctx.clearRect(0,0,cv.width,cv.height);$("wait").hidden=false;$("bar").style.opacity=1;$("bar").style.width="0";
 $("chip").textContent=D.chip;$("chip").hidden=false;$("range").textContent=D.range;
 $("wu").textContent=D.mode==="radar"?"km² open water (radar)":"km² open water";
 $("info").innerHTML=`<p><b>Frames</b>: ${esc(D.attrib)}</p><p id="fd"></p>`+(D.method?`<pre>${esc(D.method)}</pre>`:"");
 $("chart").setAttribute("aria-valuemax",n-1);
 drawPlaces();label(0);buildChart();setPlay(true);
 const q=new URLSearchParams(location.search);q.set("place",id);q.delete("mode");history.replaceState(null,"","?"+q);
 preload(tok)}

// decode ahead in time order, 4 at a time; ImageBitmap keeps decoded pixels so a frame change never waits on decode
function preload(tok){
 const n=S.fr.length;let next=0,done=0;
 const one=async()=>{while(next<n&&tok===S.token){const i=next++;let st=2,bm=null;
  for(let tries=0;tries<3&&st!==1&&tok===S.token;tries++){                                // retry a dropped connection twice
   try{if(tries)await new Promise(r=>setTimeout(r,400*tries));const im=new Image();im.src=S.fr[i].url+(tries?(S.fr[i].url.includes("?")?"&":"?")+"r="+tries:"");await im.decode();bm=im;
    if(window.createImageBitmap){try{bm=await createImageBitmap(im)}catch(e){}}st=1}catch(e){}}
  if(tok!==S.token)return;S.bm[i]=bm;S.st[i]=st;done++;S.drawn="";
  $("bar").style.width=(done/n*100)+"%";if(done===n)$("bar").style.opacity=0}};
 for(let k=0;k<Math.min(4,n);k++)one()}

// ---------- playback: hold, crossfade, next. If the next frame is not decoded yet, keep holding the current one. ----------
function nextOk(i){const n=S.fr.length;for(let s=1;s<=n;s++){const j=(i+s)%n;if(S.st[j]!==2)return j}return i}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let last=performance.now();
function tick(ts){
 requestAnimationFrame(tick);
 const dt=Math.min(.1,Math.max(0,(ts-last)/1000));last=ts;const n=S.fr.length;if(!n)return;
 if(S.playing&&!S.scrub){
  if(S.st[S.cur]===2){S.cur=nextOk(S.cur);S.nxt=nextOk(S.cur);S.t=0;S.a=0}
  else if(S.st[S.cur]===1){
   const per=TOTAL/(n+1)/S.speed,wrap=S.nxt<=S.cur,hold=REDUCED?.999:HOLD;
   S.t+=dt/per/(wrap?2:1);
   if(S.t>hold&&S.st[S.nxt]!==1){if(S.st[S.nxt]===2)S.nxt=nextOk(S.nxt);else S.t=hold}   // not ready: hold, never blank
   S.a=wrap||S.t<=hold?0:ease(Math.min(1,(S.t-hold)/(1-hold)));                          // loop restart is a clean cut
   if(S.t>=1&&S.st[S.nxt]===1){S.cur=S.nxt;S.nxt=nextOk(S.cur);S.t=0;S.a=0}
  }
 }
 paint()}
function ready(i){if(S.st[i]===1)return i;for(let j=i-1;j>=0;j--)if(S.st[j]===1)return j;for(let j=i+1;j<S.fr.length;j++)if(S.st[j]===1)return j;return -1}
function paint(){
 const A=ready(S.cur),B=S.st[S.nxt]===1?S.nxt:-1,a=B<0?0:S.a;
 const key=A+"|"+B+"|"+a.toFixed(3);if(key===S.drawn)return;S.drawn=key;
 if(A<0)return;
 if(!S.sized){const b=S.bm[A];cv.width=b.naturalWidth||b.width;cv.height=b.naturalHeight||b.height;S.sized=true;$("wait").hidden=true}
 ctx.globalAlpha=1;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(S.bm[A],0,0,cv.width,cv.height);
 if(a>0){ctx.globalAlpha=a;ctx.drawImage(S.bm[B],0,0,cv.width,cv.height);ctx.globalAlpha=1}
 const k=a>=.5?B:A;label(k);
 playhead(a>0&&B>A?A+a*(B-A):k)}
function label(k){
 if(k===S.lab)return;S.lab=k;const f=S.fr[k],P=PLACES.find(p=>p.id===S.id);
 $("kick").textContent=P.name+" · "+f.kick;$("big").textContent=f.big;
 $("wv").textContent=f.water!=null?num(f.water):"—";$("fl").textContent=f.foot;$("fl").title=f.foot;
 const fd=$("fd");if(fd)fd.innerHTML=f.detail;
 $("chart").setAttribute("aria-valuenow",k);$("chart").setAttribute("aria-valuetext",f.big+(f.water!=null?", "+num(f.water)+" km² open water":""))}

// ---------- chart = scrubber: open water per frame, same order as the frames ----------
let C=null;
function buildChart(){
 const svg=$("chart"),r=svg.getBoundingClientRect(),W=Math.max(120,r.width),H=Math.max(80,r.height),n=S.fr.length;
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 const L=8,R=W-8,T=22,Bt=H-20,x=i=>n>1?L+i/(n-1)*(R-L):(L+R)/2;
 const vals=S.fr.map(f=>f.water).filter(v=>v!=null),mx=vals.length?Math.max(...vals):0,y=v=>Bt-(mx?v/mx:0)*(Bt-T);
 C={x,y,n};let s=`<line x1="${L}" x2="${R}" y1="${Bt}" y2="${Bt}" stroke="var(--line)"/>`;
 if(vals.length){
  let d="",area="",seg=[];
  const flush=()=>{if(seg.length){area+=`M${x(seg[0])},${Bt}`+seg.map(i=>`L${x(i)},${y(S.fr[i].water)}`).join("")+`L${x(seg[seg.length-1])},${Bt}Z`;seg=[]}};
  S.fr.forEach((f,i)=>{if(f.water==null){flush();return}d+=(seg.length?"L":"M")+x(i).toFixed(1)+","+y(f.water).toFixed(1);seg.push(i)});flush();
  s+=`<line x1="${L}" x2="${R}" y1="${T}" y2="${T}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L}" y="${T-6}">${num(mx)} km²</text><text x="${L}" y="${Bt-4}">0</text>`;
  s+=`<path d="${area}" fill="var(--water)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--water)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  S.fr.forEach((f,i)=>{if(f.water!=null)s+=`<circle cx="${x(i)}" cy="${y(f.water)}" r="2" fill="var(--water)"/>`})}
 else s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle">No water numbers for this series</text>`;
 // x labels: first, last, then round years (or every pass) wherever they fit
 const pick=[0,n-1],gap=S.D.mode==="radar"?46:40;
 for(let i=1;i<n-1;i++){if(S.D.mode!=="radar"&&S.fr[i].year%5)continue;if(pick.every(j=>Math.abs(x(j)-x(i))>=gap))pick.push(i)}
 pick.forEach(i=>{if(i<0||i>=n)return;s+=`<text x="${x(i)}" y="${H-5}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(S.fr[i].tick)}</text>`});
 s+=`<line id="ph" y1="${T-4}" y2="${Bt}" stroke="var(--ink)" stroke-width="1.2" opacity=".55"/><circle id="pd" r="5.5" fill="var(--water)" stroke="var(--card)" stroke-width="2"/>`;
 svg.innerHTML=s;S.lastPh=null;playhead(S.lab<0?0:S.lab)}
function playhead(p){
 if(!C||p===S.lastPh)return;S.lastPh=p;const X=C.x(p),i=Math.floor(p),f=p-i,a=S.fr[i]?.water,b=S.fr[Math.min(i+1,C.n-1)]?.water;
 const ph=$("ph"),pd=$("pd");if(!ph)return;ph.setAttribute("x1",X);ph.setAttribute("x2",X);
 const v=a!=null&&b!=null?a+(b-a)*f:(f<.5?a:b);
 if(v!=null){pd.setAttribute("cx",X);pd.setAttribute("cy",C.y(v));pd.style.display=""}else pd.style.display="none"}
new ResizeObserver(()=>{if(S.fr.length)buildChart()}).observe($("chart"));

const chart=$("chart");
function posFrom(e){const r=chart.getBoundingClientRect(),vb=chart.viewBox.baseVal,px=(e.clientX-r.left)/r.width*vb.width;
 return Math.max(0,Math.min(1,(px-8)/(vb.width-16)))*(S.fr.length-1)}
function scrubTo(p){const n=S.fr.length,i=Math.min(n-1,Math.floor(p));S.cur=i;S.nxt=Math.min(n-1,i+1);S.a=S.nxt>i?p-i:0;S.t=0;S.drawn=""}
chart.addEventListener("pointerdown",e=>{if(!S.fr.length)return;S.scrub=true;setPlay(false);chart.setPointerCapture(e.pointerId);scrubTo(posFrom(e))});
chart.addEventListener("pointermove",e=>{if(S.scrub)scrubTo(posFrom(e))});
const endScrub=e=>{if(!S.scrub)return;S.scrub=false;const p=posFrom(e),k=Math.round(p);S.cur=k;S.nxt=nextOk(k);S.a=0;S.t=0;S.drawn=""};
chart.addEventListener("pointerup",endScrub);chart.addEventListener("pointercancel",endScrub);
function step(d){const n=S.fr.length;if(!n)return;setPlay(false);const k=Math.max(0,Math.min(n-1,(S.a>=.5?S.nxt:S.cur)+d));S.cur=k;S.nxt=nextOk(k);S.a=0;S.t=0;S.drawn=""}
chart.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){step(e.key==="ArrowRight"?1:-1);e.preventDefault()}});
document.addEventListener("keydown",e=>{if(e.target===chart||e.target.closest?.("button"))return;
 if(e.code==="Space"){setPlay(!S.playing);e.preventDefault()}else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1)});

function setPlay(on){S.playing=on;if(on){if(S.a>0&&!S.scrub){S.a=0;S.t=0}last=performance.now()}
 $("pi").innerHTML=on?'<path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/>':'<path d="M4 2l10 6-10 6z"/>';$("play").setAttribute("aria-label",on?"Pause":"Play")}
$("play").onclick=()=>setPlay(!S.playing);
$("speed").onclick=()=>{S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length];$("speed").textContent=(S.speed===.5?"½":S.speed)+"×";
 $("speed").title=`Whole sequence in about ${TOTAL/S.speed} s`};
$("speed").title=`Whole sequence in about ${TOTAL} s`;
$("ib").onclick=()=>{const o=$("info").hidden;$("info").hidden=!o;$("ib").setAttribute("aria-expanded",o)};

// ---------- start: open the asked-for place (or the first one with data) as soon as its index is in ----------
const want=new URLSearchParams(location.search).get("place");
const first=PLACES.some(p=>p.id===want)?want:PLACES[0].id;let started=false;
PLACES.forEach(p=>DATA[p.id].then(d=>{ok[p.id]=d;if(!started&&p.id===first){started=true;choose(p.id)}else drawPlaces()},()=>{}));
Promise.allSettled(PLACES.map(p=>DATA[p.id])).then(()=>{
 if(started)return;const p=PLACES.find(p=>ok[p.id]);
 if(p){started=true;choose(p.id)}else{$("wait").textContent="No time-lapse frames available yet.";$("bar").style.opacity=0}});
setPlay(true);requestAnimationFrame(tick);
</script>
